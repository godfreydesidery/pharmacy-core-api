spring:
  application:
    name: pharmacy-core-api
  threads:
    virtual:
      # Java 21 virtual threads for requests. The async event reactions run on their own bounded
      # pool (pharmacy.async), and the requests in progress are capped (pharmacy.edge.max-in-flight).
      enabled: true
  servlet:
    multipart:
      # Direct uploads (POST /api/v1/files); presigned uploads stream through the blob route.
      max-file-size: 10MB
      max-request-size: 11MB
  datasource:
    url: ${PHARMACY_DB_URL:jdbc:postgresql://localhost:5432/pharmacy}
    username: ${PHARMACY_DB_USER:pharmacy_app}
    password: ${PHARMACY_DB_PASSWORD:}
    hikari:
      # pharmacy.database's statement, lock and idle-in-transaction timeouts are added to it.
      connection-init-sql: SET TIME ZONE 'UTC'
      maximum-pool-size: ${PHARMACY_DB_POOL_SIZE:20}
      # How long a request waits for a free connection before it is answered 503 database_busy.
      connection-timeout: ${PHARMACY_DB_CONNECTION_TIMEOUT_MS:10000}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
          # PERF-10: JDBC batching. Every entity's id is a database identity (RecordedEntity,
          # GenerationType.IDENTITY), and Hibernate must run such an INSERT at once to learn the
          # id, so inserts are never batched; updates and deletes of one flush are, ordered by
          # entity and id (also a fixed lock order between flushes of different transactions).
          batch_size: 50
          batch_versioned_data: true
        order_inserts: true
        order_updates: true
  # The fallback email sender (when no platform provider is set) gives up on a server that does not
  # answer, as the providers do: a hung mail server must not hold a sender thread for ever.
  mail:
    properties:
      mail.smtp.connectiontimeout: 10000
      mail.smtp.timeout: 10000
      mail.smtp.writetimeout: 10000
  modulith:
    detection-strategy: explicitly-annotated
    events:
      jdbc:
        schema: platform
        schema-initialization:
          enabled: false
      # Off: with several instances, one that starts would deliver again every event the others
      # are still delivering. Undelivered events are delivered again by the event-resubmission job
      # instead (one instance at a time, once they are pharmacy.events.resubmit-older-than old).
      republish-outstanding-events-on-restart: ${PHARMACY_EVENTS_REPUBLISH_ON_START:false}
  mvc:
    problemdetails:
      enabled: false

server:
  port: ${PHARMACY_PORT:8080}
  shutdown: graceful
  # gzip JSON over a cellular link (RFC 9110 content coding); the live stream is never compressed.
  compression:
    enabled: true
    mime-types: application/json,application/problem+json,text/csv,text/plain
    min-response-size: 1KB

pharmacy:
  audit:
    # OPS-18: the nightly audit-partitions job moves entries trapped in the default partition into
    # their months itself (audit.repair_default_partition()); off, it alerts and the runbook says
    # how (docs/runbook/deployment.md, "Audit default partition").
    repair-default-partition: ${PHARMACY_AUDIT_REPAIR_DEFAULT_PARTITION:false}
    # PERF-7: rows of append-only ledgers that the automatic audit trail leaves out, besides the
    # entities marked @AuditIgnore (sales: SaleLine, SalePayment). Each table is its own record
    # (insert only: no update or delete grant, and a trigger refusing both), and its parent
    # document (the journal entry, the sale, the adjustment or transfer) keeps its audit entry.
    # Fully qualified class names; a name that is no entity class stops the start.
    ignored-entities:
      - tz.co.pharmacy.modules.finance.domain.JournalLine
      - tz.co.pharmacy.modules.inventory.domain.Movement
  # This instance's name in platform.job_runs and in signals to the other instances (default: the
  # host name and a random suffix).
  instance-id: ${PHARMACY_INSTANCE_ID:}
  log:
    # PHARMACY_LOG_FORMAT -> Spring Boot's structured log format (anything else: plain text).
    formats:
      json: ecs
      ecs: ecs
      logstash: logstash
      gelf: gelf
  management:
    # Prometheus on the API's own port: only where that port is not public (local, test).
    metrics-on-api-port: false
  retention:
    # platform.job_runs older than this are deleted by the nightly retention.
    job-runs-days: ${PHARMACY_JOB_RUNS_DAYS:30}
    # reporting.processed_events markers (redelivery guards of the read models) older than this.
    processed-events-days: ${PHARMACY_PROCESSED_EVENTS_DAYS:30}
  async:
    # The pool of the @Async event reactions (ledger, read models, webhooks, notices): this many
    # threads (keep it under half the database pool) and a queue of this many; past the queue a
    # reaction is refused and delivered again by the event-resubmission job.
    threads: ${PHARMACY_ASYNC_THREADS:8}
    queue: ${PHARMACY_ASYNC_QUEUE:10000}
  events:
    # Event publications whose listener failed (a ledger posting, a read model, a webhook) are
    # delivered again every 5 minutes once 5 minutes old, by one instance at a time.
    resubmit-every: PT5M
    resubmit-older-than: PT5M
    # Health "ledger" turns DOWN when a ledger posting stays incomplete longer than this.
    stale-after: PT30M
  idempotency:
    # How long an Idempotency-Key and its response are kept (IETF draft: at least 24 hours).
    lifetime: PT24H
  finance:
    reconciliation:
      # Documents younger than this are still being posted; the reconciliation leaves them out.
      grace: PT15M
  database:
    # Set on every pooled connection when it opens (PERF-2; the application role cannot ALTER ROLE):
    # a statement running longer is cancelled (503 database_busy), a lock wait longer fails (409
    # busy_try_again), a session idle inside a transaction longer is ended. PostgreSQL durations
    # (30s, 500ms, 2min); 0 turns one off. A transaction with @Transactional(timeout = ...) and a
    # scheduled job (job-statement-timeout) raise the statement limit for themselves (SET LOCAL).
    statement-timeout: ${PHARMACY_DB_STATEMENT_TIMEOUT:30s}
    lock-timeout: ${PHARMACY_DB_LOCK_TIMEOUT:5s}
    idle-in-transaction-timeout: ${PHARMACY_DB_IDLE_IN_TRANSACTION_TIMEOUT:60s}
    job-statement-timeout: ${PHARMACY_DB_JOB_STATEMENT_TIMEOUT:5m}
    # The owner role runs the migrations (migrate-and-run, migrate-only). A run-only API needs
    # neither: leave both unset there.
    owner-username: ${PHARMACY_DB_OWNER_USER:pharmacy_owner}
    owner-password: ${PHARMACY_DB_OWNER_PASSWORD:}
    # Older switch: false means run-only. pharmacy.migrations.mode wins when set.
    migrations-enabled: ${PHARMACY_DB_MIGRATIONS_ENABLED:true}
  migrations:
    # migrate-and-run (default: migrate at start, then serve), migrate-only (migrate and exit 0:
    # the one-off task before a deploy) or run-only (never migrate, hold no owner credentials,
    # refuse to start while a migration is pending). See the runbook "Migrations".
    mode: ${PHARMACY_MIGRATIONS_MODE:}
    # Every migration connection waits at most this long for a lock, then fails and rolls back,
    # instead of stalling the live traffic queued behind its lock (OPS-10).
    lock-timeout: ${PHARMACY_MIGRATIONS_LOCK_TIMEOUT:5s}
    statement-timeout: ${PHARMACY_MIGRATIONS_STATEMENT_TIMEOUT:5min}
  # The keyring (OPS-5, runbook "Rotating keys"). Named keys come from PHARMACY_KEYS_<ID> (each one
  # ECS secret; id: lower-case letters and digits), the legacy key from
  # PHARMACY_ACCESS_ENCRYPTIONKEY. Each purpose seals new values with the key its variable names,
  # or with the legacy key while unset.
  sealing:
    totp: ${PHARMACY_SEALING_TOTP:}
    providers: ${PHARMACY_SEALING_PROVIDERS:}
    webhooks: ${PHARMACY_SEALING_WEBHOOKS:}
    # Values re-sealed per transaction by POST /api/v1/platform/keys/reseal.
    reseal-batch: 200
  access:
    session-hours: ${PHARMACY_SESSION_HOURS:12}
    # Sign out after this many minutes without use (keys, mouse, touch): the limit before a
    # pharmacy is chosen and for root administrators; each pharmacy sets its own (5-60) in Settings.
    idle-minutes: ${PHARMACY_IDLE_MINUTES:15}
    idle-timeout-enabled: ${PHARMACY_IDLE_TIMEOUT_ENABLED:true}
    # Root administrators must add an authenticator app at their next sign-in (NIST 800-63B AAL2
    # for privileged accounts). Only the local and test profiles turn it off.
    require-2fa-for-root: ${PHARMACY_REQUIRE_2FA_FOR_ROOT:true}
  http:
    # A change of an edited resource (product, customer, supplier, role, branch, price list,
    # settings) without If-Match is allowed (older clients); true answers it 428
    # precondition_required. A stale If-Match is always 412 precondition_failed (STD-10).
    require-if-match: ${PHARMACY_REQUIRE_IF_MATCH:false}
  edge:
    cors-allowed-origins: ${PHARMACY_CORS_ORIGINS:}
    # Fair share: requests one pharmacy may have in progress at once (keep it under the database
    # pool size), and how long one over the limit waits for a slot before a 429.
    tenant-concurrency: ${PHARMACY_TENANT_CONCURRENCY:10}
    tenant-wait-ms: ${PHARMACY_TENANT_WAIT_MS:2000}
    # Requests this instance works on at once, whoever sends them (the live stream aside): one over
    # waits this long for a slot, then is answered 503 server_busy with Retry-After (PERF-2).
    max-in-flight: ${PHARMACY_MAX_IN_FLIGHT:100}
    max-in-flight-wait-ms: ${PHARMACY_MAX_IN_FLIGHT_WAIT_MS:250}
    # How long the edge keeps a session's pharmacy, membership and branch (PERF-9); 0 turns it off.
    # Revocations (sign-out, a member changed, a pharmacy suspended or closed) evict at once on
    # every instance; anything else is seen within this time.
    access-cache-seconds: ${PHARMACY_EDGE_ACCESS_CACHE_SECONDS:30}
  bootstrap:
    # The first root administrator, created at start when none exists (then change the password).
    root-name: ${PHARMACY_ROOT_NAME:Root Administrator}
    root-email: ${PHARMACY_ROOT_EMAIL:}
    root-password: ${PHARMACY_ROOT_PASSWORD:}
  seed:
    demo: ${PHARMACY_SEED_DEMO:false}
  tenancy:
    # A new pharmacy starts with "require an open shift to sell" on (owner's decision, 23 Nov 2026);
    # its admin can turn it off in Settings. Existing pharmacies keep theirs.
    require-open-shift-by-default: ${PHARMACY_REQUIRE_OPEN_SHIFT_BY_DEFAULT:true}
  exports:
    # The full export (POST /data-export) is built by a background worker on any instance: it
    # looks for jobs this often, sends a heartbeat while it builds, and a job whose heartbeat is
    # older than stale-after is taken over by another instance (max-attempts in all). The ZIP is
    # kept in the file store for keep, its signed link lasts link-ttl, and each table is read in
    # pages of page-rows rows, each page its own short transaction.
    poll-every-ms: ${PHARMACY_EXPORTS_POLL_MS:5000}
    stale-after: ${PHARMACY_EXPORTS_STALE_AFTER:PT10M}
    max-attempts: ${PHARMACY_EXPORTS_MAX_ATTEMPTS:3}
    keep: ${PHARMACY_EXPORTS_KEEP:P7D}
    link-ttl: ${PHARMACY_EXPORTS_LINK_TTL:PT15M}
    page-rows: ${PHARMACY_EXPORTS_PAGE_ROWS:5000}
  files:
    # local (a directory, one instance only) or s3 (AWS S3, MinIO, Cloudflare R2; any number of
    # instances). Uploads always come through the API's signed blob route (size and type checked,
    # streamed on to the store); downloads are short presigned GETs of the store.
    storage: ${PHARMACY_FILES_STORAGE:local}
    # Signs the upload links (and the local store's download links), with either store.
    signing-secret: ${PHARMACY_FILES_SIGNING_SECRET:local-development-file-signing-secret}
    local:
      root: ${PHARMACY_FILES_ROOT:target/files}
    s3:
      # No access keys here: the AWS default credentials chain (the ECS task role in production;
      # AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY or AWS_PROFILE for MinIO or a laptop).
      bucket: ${PHARMACY_FILES_S3_BUCKET:}
      # af-south-1 in production; blank: AWS_REGION.
      region: ${PHARMACY_FILES_S3_REGION:}
      # MinIO, R2 and the like: http://localhost:9000; blank for AWS. Path-style requests default
      # to on with an endpoint.
      endpoint: ${PHARMACY_FILES_S3_ENDPOINT:}
      path-style: ${PHARMACY_FILES_S3_PATH_STYLE:}
      # Keys go under this prefix (files/), so the bucket may hold other things.
      prefix: ${PHARMACY_FILES_S3_PREFIX:}
      # AES256 (SSE-S3, the default), aws:kms (the default once a KMS key is set) or none (MinIO
      # without a KMS).
      server-side-encryption: ${PHARMACY_FILES_S3_SSE:}
      kms-key-id: ${PHARMACY_FILES_S3_KMS_KEY_ID:}
    # The one-off copy of the local directory to S3 (docs/runbook/files-on-s3.md) is a command-line
    # flag only, never an environment variable (left set, the API would copy and exit on every
    # restart): --pharmacy.files.copy-local-to-s3=true --spring.main.web-application-type=none
    # [--pharmacy.files.copy-verify=full].
  integrations:
    payments:
      provider: ${PHARMACY_PAYMENTS_PROVIDER:manual}
    fiscal:
      # STD-1: none (no fiscal documents), simulator (sim, local and test profiles only), or a
      # real adapter's own value (TRA VFD needs TRA's specification and the pharmacy's credentials).
      provider: ${PHARMACY_FISCAL_PROVIDER:none}
      # The fiscal job: sends PENDING documents again after resend-after, closes past days (Z).
      job-cron: ${PHARMACY_FISCAL_JOB_CRON:0 */15 * * * *}
      resend-after: ${PHARMACY_FISCAL_RESEND_AFTER:PT10M}
  notifications:
    # The log providers write only a masked address and the length: a message may carry a reset
    # link or a sign-in code. The local and test profiles log the whole message.
    log-bodies: false
    # A sent account message (reset or invitation link, a code) keeps no text: the outbox and
    # backups hold no live secret. The local and test profiles keep it to follow links.
    keep-account-messages: false
    # The senders that deliver after commit: this many threads and a queue of this many dispatches.
    # Past the queue a dispatch is dropped (NOTIFY_REJECTED) and its queued messages are sent by
    # the notification-retries job within a minute.
    senders:
      threads: ${PHARMACY_NOTIFY_THREADS:8}
      queue: ${PHARMACY_NOTIFY_QUEUE:2000}
    # Local numbers (0712…) are sent as +<code>712… (255 = Tanzania).
    default-country-code: ${PHARMACY_NOTIFY_COUNTRY_CODE:255}
    email:
      # log (default: logs only) or smtp (set spring.mail.host/port/username/password).
      provider: ${PHARMACY_EMAIL_PROVIDER:log}
      from: ${PHARMACY_EMAIL_FROM:Pharmacy Core <no-reply@pharmacy.local>}
    sms:
      # log (default), africastalking, twilio or beem.
      provider: ${PHARMACY_SMS_PROVIDER:log}
      africastalking:
        username: ${PHARMACY_AT_USERNAME:}
        api-key: ${PHARMACY_AT_API_KEY:}
        sender-id: ${PHARMACY_AT_SENDER_ID:}
      twilio:
        account-sid: ${PHARMACY_TWILIO_ACCOUNT_SID:}
        auth-token: ${PHARMACY_TWILIO_AUTH_TOKEN:}
        from: ${PHARMACY_TWILIO_SMS_FROM:}
      beem:
        api-key: ${PHARMACY_BEEM_API_KEY:}
        secret-key: ${PHARMACY_BEEM_SECRET_KEY:}
        sender-id: ${PHARMACY_BEEM_SENDER_ID:INFO}
    whatsapp:
      # log (default) or twilio.
      provider: ${PHARMACY_WHATSAPP_PROVIDER:log}
      twilio:
        account-sid: ${PHARMACY_TWILIO_ACCOUNT_SID:}
        auth-token: ${PHARMACY_TWILIO_AUTH_TOKEN:}
        from: ${PHARMACY_TWILIO_WHATSAPP_FROM:}
    retry:
      every: PT1M
    digests:
      # Expiry digest at 07:00 and daily summary at 18:00, each tenant's local time.
      cron: "0 */15 * * * *"

# The API map is for development: off on a server unless PHARMACY_SWAGGER_ENABLED=true.
springdoc:
  # Sorted keys: docs/openapi.json is this document, compared in the build (OpenApiDocumentTest).
  writer-with-order-by-keys: true
  api-docs:
    enabled: ${PHARMACY_SWAGGER_ENABLED:false}
    version: openapi_3_1
  swagger-ui:
    enabled: ${PHARMACY_SWAGGER_ENABLED:false}

# Plain text by default. PHARMACY_LOG_FORMAT=json (or ecs) writes one JSON object per line to
# stdout in Elastic Common Schema, Spring Boot's structured logging, with the correlationId from
# the MDC (CloudWatch Logs and its metric filters read it as is); logstash and gelf also work.
logging:
  structured:
    format:
      console: ${pharmacy.log.formats.${PHARMACY_LOG_FORMAT:plain}:}

management:
  server:
    # Unset: actuator shares the API's port and serves only health. Set (8081 on ECS): actuator
    # moves to that port, reachable only inside the VPC, with health and Prometheus metrics; the
    # API's port keeps /livez and /readyz for the load balancer.
    port: ${PHARMACY_MANAGEMENT_PORT:}
  endpoints:
    web:
      exposure:
        # Prometheus is published only on a separate management port (MetricsConfiguration), or on
        # the API's port where pharmacy.management.metrics-on-api-port says so (local, test).
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true
        # /livez and /readyz on the API's port too, for a load balancer when actuator has its own.
        add-additional-paths: true
      # The probes check only that the API is up; "ledger" (stuck postings) is reported in
      # /actuator/health for monitoring and never holds back a deploy or restarts the API.
      group:
        readiness:
          include: readinessState
        liveness:
          include: livenessState

# The optional error tracker (Sentry): off unless SENTRY_DSN is set. No personal data is sent
# (no user, IP address, cookies or request bodies); ERROR log lines (such as JOB_FAILED) and
# unhandled exceptions become events. Set SENTRY_ENVIRONMENT to tell servers apart.
sentry:
  send-default-pii: false
  max-request-body-size: none
  logging:
    minimum-event-level: error
    minimum-breadcrumb-level: info
