pharmacy:
  management:
    # The tests read /actuator/prometheus on the API's (random) port.
    metrics-on-api-port: true
  # KeyringTest rotates every purpose to these keys in a context of its own. Every context holds
  # them (none active here), so what it re-seals stays readable to the rest of the suite.
  keys:
    testtotp: test-only-totp-key-0123456789abcdef
    testproviders: test-only-providers-key-0123456789abcdef
    testwebhooks: test-only-webhooks-key-0123456789abcdef
  access:
    require-2fa-for-root: false
    lockout:
      # Every test signs in from 127.0.0.1 in one server: the deliberate wrong passwords of all
      # classes add up, and the per-device limit (20 in 15 minutes) would lock the rest of the suite
      # out. Each account's own lock (5 failures) still applies and is tested.
      ip-max-failures: 1000
  notifications:
    log-bodies: true
    keep-account-messages: true
    smtp:
      # NotificationProvidersTest's broken and hung mail servers on loopback, allowed only here
      # (they skip the host and port rules, never the TLS one).
      allowed-hosts: 127.0.0.1
  bootstrap:
    root-email: root@test.local
    root-password: "Root#Test2026"
  seed:
    demo: false
  tenancy:
    # New pharmacies require an open till shift to sell (production default). Tests sell at once;
    # those about shifts switch it on with PUT /settings.
    require-open-shift-by-default: false
  edge:
    # Every test signs in from 127.0.0.1; the production default (20 a minute) would throttle them.
    auth-requests-per-minute: 1000
  exports:
    # The export worker looks for new jobs this often (production: every 5 s).
    poll-every-ms: 200
    # Small pages, so every export in the tests is read over several transactions.
    page-rows: 25
  integrations:
    webhooks:
      # WebhookRetryTest's receiver: a loopback address the SSRF test does not use, allowed only here.
      allowed-hosts: 127.0.0.2
      retry-every-ms: 1000
# The OpenAPI document (/v3/api-docs), which OpenApiDocumentTest compares with docs/openapi.json.
springdoc:
  api-docs:
    enabled: true
logging:
  level:
    org.springframework.modulith: WARN
