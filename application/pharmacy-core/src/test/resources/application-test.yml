pharmacy:
  access:
    require-2fa-for-root: false
  notifications:
    log-bodies: true
    keep-account-messages: true
    smtp:
      # NotificationProvidersTest's broken and hung mail servers on loopback, allowed only here
      # (they skip the host and port rules, never the TLS one).
      allowed-hosts: 127.0.0.1
  bootstrap:
    root-email: root@test.local
    root-password: "Root#Test2026"
  seed:
    demo: false
  tenancy:
    # New pharmacies require an open till shift to sell (production default). Tests sell at once;
    # those about shifts switch it on with PUT /settings.
    require-open-shift-by-default: false
  edge:
    # Every test signs in from 127.0.0.1; the production default (20 a minute) would throttle them.
    auth-requests-per-minute: 1000
  exports:
    # The export worker looks for new jobs this often (production: every 5 s).
    poll-every-ms: 200
    # Small pages, so every export in the tests is read over several transactions.
    page-rows: 25
  integrations:
    webhooks:
      # WebhookRetryTest's receiver: a loopback address the SSRF test does not use, allowed only here.
      allowed-hosts: 127.0.0.2
      retry-every-ms: 1000
logging:
  level:
    org.springframework.modulith: WARN
