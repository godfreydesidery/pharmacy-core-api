name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build, format check, unit, integration and architecture tests
        run: mvn -B verify
      - name: Keep the module documentation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spring-modulith-docs
          path: architecture-tests/target/spring-modulith-docs
          if-no-files-found: ignore

  image:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build the image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: pharmacy-core-api:ci
