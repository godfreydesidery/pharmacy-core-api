# Railway deployment settings (https://docs.railway.com/reference/config-as-code).
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
# Readiness turns UP once migrations have run and the context has started.
healthcheckPath = "/actuator/health/readiness"
healthcheckTimeout = 300
# Always restart: a crash loop must not leave the API down for good after a few tries (the chaos
# run killed the API mid-day; every sale came through once it was back).
restartPolicyType = "ALWAYS"
